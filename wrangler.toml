name = "rpc-racer"
main = "src/index.ts"
compatibility_date = "2026-04-21"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"

routes = [
  { pattern = "rpc.steer.fun", custom_domain = true },
  { pattern = "evm.stupidtech.net", custom_domain = true },
]

[[durable_objects.bindings]]
name = "METRICS_DO"
class_name = "MetricsDurableObject"

[[ratelimits]]
name = "RPC_BURST_RATE_LIMITER"
namespace_id = "928341001"

[ratelimits.simple]
limit = 60
period = 10

[[ratelimits]]
name = "RPC_SUSTAINED_RATE_LIMITER"
namespace_id = "928341002"

[ratelimits.simple]
limit = 60
period = 60

[[analytics_engine_datasets]]
binding = "METRICS_ANALYTICS"
dataset = "rpc_racer_metrics"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsDurableObject"]

[vars]
CHAINLIST_RPCS_URL = "https://chainlist.org/rpcs.json"
ALCHEMY_NETWORK_CONFIG_URL = "https://app-api.alchemy.com/trpc/config.getNetworkConfig"
DEFAULT_TIMEOUT_MS = "2000"
# Cloudflare account ID used by `/stats` to query Analytics Engine. The read
# token itself is stored as the `ANALYTICS_TOKEN` secret (Account Analytics: Read).
CF_ACCOUNT_ID = "2e6717908caccc8ef5eebae01beea4aa"
STATS_WINDOW_DAYS = "30"
